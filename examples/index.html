<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jumbosocket × Datastar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon-32x32.png"
    />
    <link type="text/plain" rel="author" href="/humans.txt" />

    <!-- Datastar: the hypermedia framework. ~12 KiB, no build step. -->
    <script
      type="module"
      src="https://cdn.jsdelivr.net/gh/starfederation/[email protected]/bundles/datastar.js"
    ></script>

    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        max-width: 40rem;
        margin: 4rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      .muted {
        opacity: 0.6;
      }
      .card {
        border: 1px solid currentColor;
        border-radius: 0.5rem;
        padding: 1rem 1.25rem;
        margin: 1.5rem 0;
      }
      .big {
        font-size: 2.5rem;
        font-variant-numeric: tabular-nums;
        margin: 0;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        cursor: pointer;
      }
    </style>
  </head>

  <!-- Open the long-lived SSE stream as soon as the page initializes. -->
  <body data-init="@get('/stream')">
    <h1>Jumbosocket Boilerplate App</h1>
    <p class="muted">
      A small, dependency-free hypermedia server, driving the DOM with Datastar
      Server-Sent Events.
    </p>

    <div class="card">
      <p class="muted">Server time (pushed every second over SSE):</p>
      <p class="big" id="clock">connecting…</p>
    </div>

    <div class="card">
      <p class="muted">
        Shared counter — every connected browser sees the same value update
        live:
      </p>
      <p class="big" id="count">0</p>
      <button data-on:click="@get('/increment')">+1</button>
    </div>
  </body>
</html>
